name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.2.0 requires JDK 17. The ubuntu-latest image already provides the
      # Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk, platform android-34,
      # build-tools 34.0.0), so no sdk.dir / local.properties is needed here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric 4.11.1 fetches its android-all-instrumented jars at test
      # runtime into ~/.m2, outside anything setup-gradle caches. Without this the
      # suite re-downloads ~200MB every run and goes red on any Maven hiccup.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -v
