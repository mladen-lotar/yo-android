name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # First, because it is the cheapest and because the thing it catches is the one that cannot be
  # undone by a later commit. This repository is PUBLIC and published a live production password
  # for three days (docs/RELEASE.md section 4c); removing a secret from HEAD does not unpublish
  # it, so the only useful moment to catch one is before it merges.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scanner unit tests
        run: python3 -m unittest tools.test_scan_secrets -v
      - name: Scan tracked files for credentials
        run: python3 tools/scan-secrets.py

  android:
    name: Android unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21, not 17: Robolectric refuses to create a sandbox for Android SDK 36 on anything
      # lower ("Android SDK 36 requires Java 21"). The app itself still compiles to 17 bytecode -
      # compileOptions decides that, not the JVM Gradle happens to run on.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches its android-all-instrumented jars at test runtime into ~/.m2, outside
      # anything setup-gradle caches. Without this the suite re-downloads them every run and goes
      # red on any Maven hiccup.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # lint rather than assembleDebug. Producing an APK now requires real deployment
      # configuration - backend URL, invite URL, privacy URL, OAuth client id - and CI has no
      # business holding those. Lint still merges the manifest, links resources and compiles
      # everything, so it covers what assembleDebug covered here, and adds static analysis.
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -v
